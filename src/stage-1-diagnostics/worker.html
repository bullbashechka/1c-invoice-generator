<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>КА — фоновая очередь</title>
    <script src="https://api.bitrix24.tech/api/v1/"></script>
    <script src="background_worker.js"></script>
    <script src="worker-config.js"></script>
</head>
<body>
    <script>
        (() => {
            const settings = window.STAGE1_WORKER_CONFIG || {};
            window.BX24?.init(() => {
                try {
                    const info=window.BX24.placement.info();
                    localStorage.setItem("stage1.worker.environment",JSON.stringify({
                        observedAt:new Date().toISOString(),
                        status:desktopActivationRefusal(window)||"desktop_detected",
                        placement:info?.placement||"UNKNOWN",
                        handler:window.location.origin+window.location.pathname,
                        enabled:settings.enabled===true,
                    }));
                } catch { /* Environment diagnosis does not enable processing. */ }
            });
            let worker = null;
            window.STAGE1_WORKER_STATUS = "starting";
            startBackgroundWorker(settings, {windowRef:window, client:window.BX24})
                .then((value) => {
                    worker = value;
                    window.STAGE1_WORKER_STATUS = value.status;
                })
                .catch(() => { window.STAGE1_WORKER_STATUS = "unavailable"; });
            window.addEventListener("pagehide", () => {
                worker?.stop?.();
                worker = null;
            }, {once:true});
        })();
    </script>
</body>
</html>
